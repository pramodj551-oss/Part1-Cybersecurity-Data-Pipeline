name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src run_pipeline.py

      - name: Run regression and unit tests
        run: python -m pytest -q

      - name: Run end-to-end pipeline
        run: python run_pipeline.py

      - name: Execute 29 SQL integration queries
        run: python -m pytest -q tests/test_sql_queries.py

      - name: Validate EDA notebook format
        run: python -c "import nbformat; nbformat.read('EDA.ipynb', as_version=4)"

      - name: Execute EDA notebook
        run: >-
          python -m nbconvert --to notebook --execute EDA.ipynb
          --output executed_EDA.ipynb --output-dir /tmp
          --ExecutePreprocessor.timeout=180

      - name: Validate executed EDA notebook
        run: >-
          python -c "import nbformat; p='/tmp/executed_EDA.ipynb'; nb=nbformat.read(p, as_version=4); assert nb.cells, 'EDA notebook has no cells'; assert not any(cell.cell_type == 'code' and cell.get('outputs') and any('ename' in out for out in cell.outputs) for cell in nb.cells), 'EDA notebook contains execution errors'; print('EDA runtime validation: PASS')"

      - name: Verify generated artifacts
        run: |
          test -s data/processed/clean_incidents_reports.csv
          test -s data/processed/engineered_incidents.csv
          test -s outputs/incidents.db
          test -s outputs/summary_report.csv
          test -s outputs/cleaning_report.json
          test -s /tmp/executed_EDA.ipynb

      - name: Upload EDA and pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step8-eda-pipeline-artifacts
          path: |
            /tmp/executed_EDA.ipynb
            data/processed/clean_incidents_reports.csv
            data/processed/engineered_incidents.csv
            outputs/incidents.db
            outputs/summary_report.csv
            outputs/cleaning_report.json
          if-no-files-found: error
